<ion-content [fullscreen]="true" class="splash-content">
  <div class="splash-wrapper">
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-icon">
        <ion-icon name="bulb"></ion-icon>
      </div>
    </div>

    <!-- App Title -->
    <h1 class="app-title">Quick 5</h1>
    <p class="app-tagline">5 puzzles, 5 minutes, daily</p>

    <!-- Get Started Button -->
    <div class="button-container">
      <ion-button expand="block" class="get-started-button" (click)="getStarted()">
        Get Started
        <ion-icon name="arrow-forward" slot="end"></ion-icon>
      </ion-button>
    </div>

    <!-- Personalized Greeting (shows after clicking Get Started if user exists) -->
    <div class="welcome-back" *ngIf="showWelcomeBack" [@slideUpFade]>
      <div class="welcome-icon">👋</div>
      <h2 class="welcome-text">Hi, {{ username }}!</h2>
      <p class="welcome-subtext">Let's continue your journey</p>
    </div>

    <!-- Features -->
    <div class="features-container" *ngIf="!showWelcomeBack">
      <div class="feature-item">
        <div class="feature-number">5+</div>
        <div class="feature-label">Categories</div>
      </div>
      <div class="feature-divider"></div>
      <div class="feature-item">
        <div class="feature-number">100+</div>
        <div class="feature-label">Puzzles</div>
      </div>
      <div class="feature-divider"></div>
      <div class="feature-item">
        <div class="feature-number">Daily</div>
        <div class="feature-label">Challenges</div>
      </div>
    </div>

  </div>

  <!-- Username Modal (appears for new users) -->
  <div class="username-modal" *ngIf="showUsernameModal" [@fadeIn]>
    <div class="modal-backdrop"></div>
    <div class="modal-content" [@slideUp]>
      <div class="modal-header">
        <div class="welcome-icon">👋</div>
        <h2>Welcome to Quick 5!</h2>
        <p>What should we call you?</p>
      </div>

      <div class="input-container">
        <ion-input
          [(ngModel)]="username"
          placeholder="Enter your name"
          class="username-input"
          (keyup.enter)="saveUsername()"
          [autofocus]="true"
          maxlength="20"
        ></ion-input>
      </div>

      <div class="modal-actions">
        <ion-button 
          expand="block" 
          class="continue-button" 
          (click)="saveUsername()" 
          [disabled]="!username || username.trim().length === 0">
          Continue
          <ion-icon name="arrow-forward" slot="end"></ion-icon>
        </ion-button>
      </div>

      <p class="modal-note">You can change this later in settings</p>
    </div>
  </div>

</ion-content>
